spring:
  application:
    name: notification-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.example.notifications.event.UserEvent
        spring.json.trusted.packages: "*"
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}

server:
  port: 8081

app:
  kafka:
    topic: user-events
  notification:
    site-name: ${NOTIFICATION_SITE_NAME:site.com}
    from: ${NOTIFICATION_FROM:noreply@localhost}
    subject-created: "Ваш аккаунт создан"
    subject-deleted: "Ваш аккаунт удалён"