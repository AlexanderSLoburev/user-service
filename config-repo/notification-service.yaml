server:
  port: 8086

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.value.default.type: com.example.notifications.event.UserEvent
        spring.json.trusted.packages: "*"
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}

app:
  kafka:
    topic: user-events
  notification:
    site-name: ${NOTIFICATION_SITE_NAME:site.com}
    from: ${NOTIFICATION_FROM:noreply@localhost}
    subject-created: "Ваш аккаунт создан"
    subject-deleted: "Ваш аккаунт удалён"
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true